[project]
name = "docsid"
version = "0.1.0"
description = "A software for document management"
authors = [
    { name = "Colk-tech", email = "master@colk.dev" }
]
dependencies = []
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/docsid"]
